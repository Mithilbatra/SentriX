name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Python, Java and package versions match infra/Dockerfile.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Install dependencies
        run: |
          pip install pytest==9.2.0 fastapi==0.162.0 httpx==0.28.1 happybase==1.3.0 kafka-python==2.3.3 \
            numpy==1.26.4 pyspark==3.5.9
          pip install --no-deps graphframes-py==0.9.3
          jar="$(python -c 'import os, pyspark; print(os.path.dirname(pyspark.__file__))')/jars/graphframes.jar"
          curl -fsSLo "$jar" https://repo1.maven.org/maven2/io/graphframes/graphframes-spark3_2.12/0.9.3/graphframes-spark3_2.12-0.9.3.jar
          echo "3ec893c194b0abf716e8c350cafd7ba152026ac613d1365a8da0c8f9bfdce4b8  $jar" | sha256sum -c -
      - run: python -m pytest -q
